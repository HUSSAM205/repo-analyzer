# Render Blueprint for the Repo Analyzer backend -- 100%-free-tier setup.
#
# A single free Render web service runs BOTH the FastAPI API and the ARQ
# background worker (backend/scripts/start_unified.sh), because Render has
# no free tier for standalone worker services at all. Postgres (with
# pgvector) and Redis are NOT provisioned here either -- Render's own free
# Postgres is deleted 30 days after creation, which defeats "permanent."
# Use an external always-free provider instead:
#   - Postgres: neon.tech or supabase.com (both have a real free tier with
#     pgvector support, no expiration).
#   - Redis: upstash.com (real free tier, TLS `rediss://` URL).
# Paste their connection strings into DATABASE_URL / REDIS_URL below when
# Render prompts for them -- see README.md's deployment checklist for the
# exact steps (enabling pgvector, where to find each connection string).
#
# Any envVar marked `sync: false` is a secret Render will prompt you to
# fill in yourself when applying this blueprint -- nothing sensitive lives
# in this file.
#
# Tradeoff worth knowing: running the worker in the same container as the
# API (rather than the isolated two-container setup docker-compose.yml
# uses locally) means a heavy embedding job can slow HTTP responses while
# it runs -- see start_unified.sh's own comment. The free web plan also
# spins down after 15min idle (~1min cold start on the next request). Both
# are the real cost of this being free, not something either script hides.

services:
  - type: web
    name: repo-analyzer
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./scripts/start_unified.sh
    plan: free
    healthCheckPath: /health
    envVars:
      # External managed Postgres (Neon/Supabase) -- paste its connection
      # string as-is. Settings.database_url upgrades a plain "postgresql://"
      # to "postgresql+asyncpg://" automatically, and db/session.py strips
      # the sslmode/channel_binding query params Neon/Supabase include by
      # default (asyncpg wants TLS expressed differently -- both files
      # explain why in their own comments), so no manual editing is needed.
      - key: DATABASE_URL
        sync: false
      # External Upstash Redis -- paste its `rediss://` connection string
      # as-is. Both consumers (arq's RedisSettings.from_dsn and redis-py's
      # Redis.from_url, see app/workers/settings.py and
      # app/core/rate_limit.py) recognize the "rediss://" scheme and enable
      # TLS automatically -- no extra config needed.
      - key: REDIS_URL
        sync: false
      # RS256 keypair -- generate locally with
      # `python backend/scripts/generate_keys.py`, then upload
      # backend/keys/jwt_private.pem and jwt_public.pem as Render Secret
      # Files (Dashboard -> this service -> Environment -> Secret Files).
      # Render mounts them at /etc/secrets/<filename>, matching the paths
      # below.
      - key: JWT_PRIVATE_KEY_PATH
        value: /etc/secrets/jwt_private.pem
      - key: JWT_PUBLIC_KEY_PATH
        value: /etc/secrets/jwt_public.pem
      - key: JWT_ALGORITHM
        value: RS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Verified live against the real Groq /models endpoint -- these are
      # the two models this deployment's GroqClient fallback logic is
      # actually tuned for (auto-switches between them on 404/429; see
      # app/core/llm_providers.py). Older Llama 3.x model ids are retired
      # on Groq's current catalog and will 404 if substituted here.
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      # No local Ollama server is reachable from Render -- leave empty so
      # a cloud-provider failure surfaces its real error immediately
      # instead of wasting time on a doomed local-fallback connection
      # attempt. Set this only if OLLAMA_BASE_URL below points at a real,
      # internet-reachable Ollama instance you run yourself.
      - key: OLLAMA_MODEL
        value: ""
      - key: OLLAMA_BASE_URL
        value: ""
      # Optional additional providers -- get_llm_client() falls back to
      # whichever of these has a usable key if GROQ_API_KEY is missing.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Empty unless something calls this API straight from a browser --
      # the bundled Next.js frontend proxies every call server-side and
      # never needs this. Set to your Vercel frontend's URL(s) (comma-
      # separated) or "*" only if you add a direct-from-browser caller.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAX_REPO_SIZE_MB
        value: "500"
      - key: MAX_FILES_PER_REPO
        value: "5000"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "5"
      - key: RATE_LIMIT_CHAT_PER_MINUTE
        value: "15"
